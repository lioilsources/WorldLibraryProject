# Kurátorský registr zákonů pro Právníka — vrstva 1 (jádro). Čte ho
# ingest_law.py (--tier 1). Klíč work_id se odvozuje: cz.sb.{rok}.{cislo}.
#
# aliases  = kmeny pro směrování (retrieval.route(): folded, bez diakritiky,
#            hledá se od hranice slova) — čeština skloňuje, takže každý pád
#            zvlášť; číslo předpisu je bezpečný kmen.
# abbr     = zkratky jako CELÉ tokeny pro parser citací (§ 51 ZP) — do stem
#            aliasů nepatří: „zp" by od hranice slova chytilo „zpět".
# name_cs  = když chybí, vezme se uplnaCitace z e-Sbírky.
# short    = krátký název do UI a do promptu.
# subgroup = podtyp e-Sbírky (ZAKON | ZAKONUST); group = odvětví (topics.yaml).

groups:
  ustavni: Ústavní právo
  obcanske: Občanské právo
  obchodni: Obchodní a hospodářské právo
  trestni: Trestní právo
  pracovni_socialni: Pracovní právo a sociální zabezpečení
  spravni: Správní právo
  danove: Daňové právo
  justice: Justice a právnické profese

