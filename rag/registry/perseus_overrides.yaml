# Kurátorské výjimky pro Perseus (řečtina/latina). Metadata děl se čtou
# z __cts__.xml / teiHeader; tady je jen to, co odtud nejde: český název
# a jméno autora, priorita (1 = kanonické: kapitoly + summary directorem)
# a aliasy pro směrování dotazu. Klíč = work_id ('grc.tlg0012.tlg001').
# Ostatní díla dostanou prioritu 2 automaticky (3 = fragmenty, lexika, scholia).
#
# Pro celého autora (všechna jeho díla) slouží sekce `authors:` — hodí se
# u Platóna nebo Plútarcha, kde je desítky děl a jméno autora je to, co
# uživatel do dotazu napíše.

