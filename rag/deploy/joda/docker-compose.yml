# ChromaDB server pro JODA (NAS). Spustit: docker compose up -d
# Data žijí v ./chroma-data vedle tohoto souboru.
services:
  chromadb:
    image: chromadb/chroma:0.6.3
    container_name: chromadb
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./chroma-data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
